<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشتريات والمصروفات - شبكة إبداع</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl font-bold text-lg shadow"><i class="fa-solid fa-file-invoice-dollar"></i></div>
                <div>
                    <h1 class="text-lg font-bold">شبكة إبداع للاتصالات</h1>
                    <p class="text-xs text-slate-400">إدارة المصروفات وربط القطع وتعديلها</p>
                </div>
            </div>
            <a href="towers.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-sm font-semibold transition border border-slate-700">
                <i class="fa-solid fa-tower-broadcast ml-1"></i> الأبراج
            </a>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8 flex-grow space-y-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div>
                <h2 class="text-2xl font-extrabold text-slate-900">سجل القطع والمصروفات</h2>
                <p class="text-xs text-slate-500 mt-1">إضافة، تعديل، وحذف بنود المشتريات والمصاريف وربطها بالأبراج</p>
            </div>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> إضافة قطعة أو مصروف جديد
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse text-sm">
                    <thead class="bg-slate-100 text-slate-600 text-xs uppercase">
                        <tr>
                            <th class="p-4">البند</th>
                            <th class="p-4">التصنيف</th>
                            <th class="p-4">البرج المرتبط</th>
                            <th class="p-4">التكلفة</th>
                            <th class="p-4">التاريخ</th>
                            <th class="p-4">ملاحظات</th>
                            <th class="p-4 text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="purchases-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="purchase-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
            <h3 id="modal-title" class="text-lg font-bold text-slate-900 border-b pb-3">إضافة بند جديد</h3>
            <div class="space-y-3 text-sm">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">اسم البند أو القطعة:</label>
                    <input type="text" id="item_name" placeholder="مثال: سويتش 8 بورت" class="w-full border rounded-xl p-3 bg-slate-50">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">التصنيف:</label>
                        <select id="category" class="w-full border rounded-xl p-3 bg-slate-50">
                            <option value="معدات ونقاط">معدات ونقاط بث</option>
                            <option value="صيانة وكاتب">صيانة وكسوة</option>
                            <option value="اشتراك مزود">اشتراك مزود الإنترنت</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-600 font-semibold mb-1">التكلفة (₪):</label>
                        <input type="number" id="amount" placeholder="0.00" class="w-full border rounded-xl p-3 bg-slate-50">
                    </div>
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">البرج أو النقطة المرتبطة:</label>
                    <select id="tower_id" class="w-full border rounded-xl p-3 bg-slate-50">
                        <option value="">-- بدون ربط (مصروف عام) --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-slate-600 font-semibold mb-1">ملاحظات:</label>
                    <input type="text" id="notes" placeholder="ملاحظات..." class="w-full border rounded-xl p-3 bg-slate-50">
                </div>
            </div>
            <div class="flex gap-2 pt-2 border-t">
                <button onclick="savePurchase()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-semibold">حفظ</button>
                <button onclick="closeModal()" class="bg-gray-100 text-slate-700 px-5 py-3 rounded-xl font-semibold">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase } from './assets/js/supabase.js';

        let purchasesList = [];

        async function init() {
            let { data: towers } = await supabase.from('towers').select('id, name');
            if(towers) {
                document.getElementById('tower_id').innerHTML = '<option value="">-- بدون ربط (مصروف عام) --</option>' + 
                    towers.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
            }
            fetchPurchases();
        }

        async function fetchPurchases() {
            let { data, error } = await supabase.from('purchases').select('*, towers(name)').order('purchase_date', { ascending: false });
            purchasesList = data || [];
            let tbody = document.getElementById('purchases-table-body');
            
            if(purchasesList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-400">لا توجد مصروفات مسجلة.</td></tr>`;
                return;
            }

            tbody.innerHTML = purchasesList.map(p => `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-bold">${p.item_name}</td>
                    <td class="p-4 text-xs"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded">${p.category}</span></td>
                    <td class="p-4">${p.towers ? `<span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold">${p.towers.name}</span>` : '<span class="text-slate-400">عام</span>'}</td>
                    <td class="p-4 font-extrabold text-rose-600">${p.amount} ₪</td>
                    <td class="p-4 text-xs text-slate-500">${p.purchase_date}</td>
                    <td class="p-4 text-xs text-slate-500">${p.notes || '-'}</td>
                    <td class="p-4 text-center space-x-2 space-x-reverse">
                        <button onclick="editPurchase('${p.id}')" class="bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1 rounded text-xs font-semibold"><i class="fa-solid fa-pen"></i> تعديل</button>
                        <button onclick="deletePurchase('${p.id}')" class="bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1 rounded text-xs font-semibold"><i class="fa-solid fa-trash"></i> حذف</button>
                    </td>
                </tr>
            `).join('');
        }

        window.openModal = function() {
            document.getElementById('edit-id').value = '';
            document.getElementById('item_name').value = '';
            document.getElementById('category').value = 'معدات ونقاط';
            document.getElementById('amount').value = '';
            document.getElementById('tower_id').value = '';
            document.getElementById('notes').value = '';
            document.getElementById('modal-title').innerText = 'إضافة بند أو قطعة جديدة';
            document.getElementById('purchase-modal').classList.remove('hidden');
        }

        window.closeModal = function() {
            document.getElementById('purchase-modal').classList.add('hidden');
        }

        window.editPurchase = function(id) {
            let p = purchasesList.find(item => item.id == id);
            if(!p) return;
            document.getElementById('edit-id').value = p.id;
            document.getElementById('item_name').value = p.item_name;
            document.getElementById('category').value = p.category;
            document.getElementById('amount').value = p.amount;
            document.getElementById('tower_id').value = p.tower_id || '';
            document.getElementById('notes').value = p.notes || '';
            document.getElementById('modal-title').innerText = 'تعديل بيانات المصروف / القطعة';
            document.getElementById('purchase-modal').classList.remove('hidden');
        }

        window.savePurchase = async function() {
            let id = document.getElementById('edit-id').value;
            let item_name = document.getElementById('item_name').value.trim();
            let category = document.getElementById('category').value;
            let amount = parseFloat(document.getElementById('amount').value);
            let tower_id = document.getElementById('tower_id').value || null;
            let notes = document.getElementById('notes').value.trim();

            if(!item_name || !amount) return alert("أدخل اسم البند والتكلفة");

            let payload = { item_name, category, amount, tower_id, notes };
            let res;

            if(id) {
                // تعديل بند موجود
                res = await supabase.from('purchases').update(payload).eq('id', id);
            } else {
                // إضافة بند جديد
                payload.purchase_date = new Date().toISOString().split('T')[0];
                res = await supabase.from('purchases').insert([payload]);
            }

            if(res.error) alert(res.error.message);
            else { closeModal(); fetchPurchases(); }
        }

        window.deletePurchase = async function(id) {
            if(!confirm("هل أنت متأكد من حذف هذا البند؟")) return;
            let { error } = await supabase.from('purchases').delete().eq('id', id);
            if(error) alert(error.message);
            else fetchPurchases();
        }

        init();
    </script>
</body>
</html>
